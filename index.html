<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Chat Acak - Realtime & Hemat Data</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 py-3 px-6 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent">ChatGlobal</span>
        </div>
        <div class="flex items-center space-x-4">
            <span id="statusBadge" class="px-3 py-1 bg-red-500/20 text-red-400 text-xs font-medium rounded-full border border-red-500/30">Offline</span>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="flex-grow flex flex-col lg:flex-row p-4 gap-4 max-w-7xl mx-auto w-full">
        
        <!-- Layar Video -->
        <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
            <div class="bg-slate-900 aspect-video rounded-2xl border border-slate-800 flex flex-col items-center justify-center relative overflow-hidden shadow-2xl">
                <div id="remotePlaceholder" class="flex flex-col items-center text-slate-500 space-y-2">
                    <span class="text-sm font-medium">Menunggu lawan bicara...</span>
                </div>
            </div>
            <div class="bg-slate-900 aspect-video rounded-2xl border border-slate-800 flex flex-col items-center justify-center relative overflow-hidden shadow-2xl">
                <div id="localPlaceholder" class="flex flex-col items-center text-slate-500 space-y-2">
                    <span class="text-sm font-medium">Kamera Belum Aktif</span>
                </div>
                <video id="localVideo" autoplay muted playsinline class="absolute inset-0 w-full h-full object-contain hidden scale-x-[-1]"></video>
            </div>
        </div>

        <!-- Panel Chat -->
        <div class="w-full lg:w-80 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col h-[350px] lg:h-auto shadow-xl overflow-hidden">
            <div class="p-3 border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase">Obrolan Teks</div>
            <div id="chatBox" class="flex-grow p-3 overflow-y-auto space-y-2 text-sm flex flex-col"></div>
            <div class="p-3 border-t border-slate-800 flex gap-2">
                <input type="text" id="chatInput" placeholder="Ketik pesan..." class="flex-grow bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm" disabled>
                <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 px-4 py-2 rounded-xl text-sm disabled:opacity-50" disabled>Kirim</button>
            </div>
        </div>
    </main>

    <!-- Footer & Kontrol -->
    <footer class="bg-slate-900 border-t border-slate-800 p-4 flex flex-col items-center gap-4">
        <label class="flex items-center gap-2 text-sm text-slate-400 cursor-pointer">
            <input type="checkbox" id="lowDataMode" class="w-4 h-4 rounded border-slate-700 bg-slate-800"> Mode Hemat Data (3G)
        </label>
        <div class="flex gap-4">
            <button id="actionBtn" onclick="toggleStart()" class="bg-emerald-600 px-8 py-3 rounded-2xl font-bold transition">Mulai (Start)</button>
            <button id="nextBtn" onclick="nextChat()" class="bg-slate-800 px-6 py-3 rounded-2xl font-semibold transition hidden">Lewati (Next)</button>
        </div>
    </footer>

    <script>
        const firebaseConfig = { databaseURL: "https://obrolan-global-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isStarted = false, localStream = null, myUserId = 'user_' + Math.random().toString(36).substr(2, 9), currentRoomId = null, chatListener = null;

        async function toggleStart() {
            if (!isStarted) {
                try {
                    const isLowData = document.getElementById('lowDataMode').checked;
                    const constraints = isLowData ? { video: { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 15 } }, audio: true } : { video: true, audio: true };
                    
                    localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    const localVideo = document.getElementById('localVideo');
                    localVideo.srcObject = localStream;
                    localVideo.classList.remove('hidden');
                    document.getElementById('localPlaceholder').classList.add('hidden');

                    isStarted = true;

                    // Perbaikan: Ubah status badge saat tombol mulai ditekan
                    const statusBadge = document.getElementById('statusBadge');
                    statusBadge.textContent = 'Mencari...';
                    statusBadge.className = 'px-3 py-1 bg-yellow-500/20 text-yellow-400 text-xs font-medium rounded-full border border-yellow-500/30';

                    document.getElementById('actionBtn').textContent = 'Berhenti (Stop)';
                    document.getElementById('actionBtn').className = 'bg-red-600 px-8 py-3 rounded-2xl font-bold transition';
                    document.getElementById('nextBtn').classList.remove('hidden');
                    
                    findPartner();
                } catch (err) { 
                    alert('Izin kamera gagal atau ditolak.'); 
                    console.error(err);
                }
            } else { stopChat(); }
        }

        function findPartner() {
            const waitingRef = db.ref('waiting_room');
            waitingRef.once('value', (snapshot) => {
                let partnerId = null;
                snapshot.forEach((child) => { if (child.key !== myUserId) partnerId = child.key; });

                if (partnerId) {
                    waitingRef.child(partnerId).remove();
                    let roomId = 'room_' + Math.min(myUserId, partnerId) + '_' + Math.max(myUserId, partnerId);
                    db.ref('rooms/' + roomId).set({ user1: myUserId, user2: partnerId });
                    joinRoom(roomId);
                } else {
                    waitingRef.child(myUserId).set({ timestamp: Date.now() });
                    waitingRef.child(myUserId).onDisconnect().remove();
                    listenForMatchInvitation();
                }
            });
        }

        function listenForMatchInvitation() {
            db.ref('rooms').on('child_added', (snapshot) => {
                const room = snapshot.val();
                if (room && (room.user1 === myUserId || room.user2 === myUserId)) {
                    joinRoom(snapshot.key);
                }
            });
        }

        function joinRoom(roomId) {
            currentRoomId = roomId;
            db.ref('waiting_room/' + myUserId).remove();
            
            // Perbaikan: Ubah status badge menjadi Terhubung
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = 'Terhubung';
            statusBadge.className = 'px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-medium rounded-full border border-emerald-500/30';

            document.getElementById('chatInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            chatListener = db.ref('rooms/' + roomId + '/messages').on('child_added', (snapshot) => {
                const msg = snapshot.val();
                if (msg) appendMessage(msg.sender === myUserId ? 'me' : 'other', msg.text);
            });
        }

        function sendMessage() {
            const text = document.getElementById('chatInput').value.trim();
            if (text && currentRoomId) {
                db.ref('rooms/' + currentRoomId + '/messages').push({ sender: myUserId, text: text });
                document.getElementById('chatInput').value = '';
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="${sender === 'me' ? 'bg-blue-600 self-end' : 'bg-slate-800 self-start'} p-2 rounded-xl text-xs max-w-[80%] break-words">${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function stopChat() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (currentRoomId) db.ref('rooms/' + currentRoomId).remove();
            db.ref('waiting_room/' + myUserId).remove();
            location.reload();
        }
        
        function nextChat() { 
            if (currentRoomId) db.ref('rooms/' + currentRoomId).remove();
            db.ref('waiting_room/' + myUserId).remove();
            currentRoomId = null;
            document.getElementById('chatBox').innerHTML = '';
            
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = 'Mencari...';
            statusBadge.className = 'px-3 py-1 bg-yellow-500/20 text-yellow-400 text-xs font-medium rounded-full border border-yellow-500/30';
            
            findPartner(); 
        }
    </script>
</body>
</html>
