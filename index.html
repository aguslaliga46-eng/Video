<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Chat Acak - Realtime Firebase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat Version untuk kemudahan integrasi) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 py-3 px-6 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent">ChatGlobal</span>
        </div>
        <div class="flex items-center space-x-4">
            <span id="statusBadge" class="px-3 py-1 bg-red-500/20 text-red-400 text-xs font-medium rounded-full border border-red-500/30">Offline</span>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="flex-grow flex flex-col lg:flex-row p-4 gap-4 max-w-7xl mx-auto w-full">
        
        <!-- Bagian Kiri: Layar Video -->
        <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
            
            <!-- Layar Lawan Bicara -->
            <div class="bg-slate-900 aspect-video rounded-2xl border border-slate-800 flex flex-col items-center justify-center relative overflow-hidden shadow-2xl">
                <div id="remotePlaceholder" class="flex flex-col items-center text-slate-500 space-y-2">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span class="text-sm font-medium">Menunggu lawan bicara...</span>
                </div>
                <div class="absolute bottom-3 left-3 bg-black/50 px-2.5 py-1 rounded-md text-xs backdrop-blur-sm">Orang Asing</div>
            </div>

            <!-- Layar Kamera Sendiri -->
            <div class="bg-slate-900 aspect-video rounded-2xl border border-slate-800 flex flex-col items-center justify-center relative overflow-hidden shadow-2xl">
                <div id="localPlaceholder" class="flex flex-col items-center text-slate-500 space-y-2">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                    <span class="text-sm font-medium">Kamera Belum Aktif</span>
                </div>
                <video id="localVideo" autoplay muted playsinline class="absolute inset-0 w-full h-full object-cover hidden scale-x-[-1]"></video>
                <div class="absolute bottom-3 left-3 bg-black/50 px-2.5 py-1 rounded-md text-xs backdrop-blur-sm">Kamera Anda</div>
            </div>

        </div>

        <!-- Bagian Kanan: Panel Chat Teks Realtime -->
        <div class="w-full lg:w-80 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col h-[350px] lg:h-auto shadow-xl overflow-hidden">
            <div class="p-3 bg-slate-880 border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider">Obrolan Teks Realtime</div>
            
            <div id="chatBox" class="flex-grow p-3 overflow-y-auto space-y-2 text-sm flex flex-col">
                <div class="text-center text-slate-600 text-xs my-auto">Belum terhubung ke ruang obrolan.</div>
            </div>

            <div class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
                <input type="text" id="chatInput" placeholder="Ketik pesan..." class="flex-grow bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500" disabled>
                <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition disabled:opacity-50" disabled>Kirim</button>
            </div>
        </div>

    </main>

    <!-- Tombol Kontrol Bawah -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-6 flex justify-center items-center gap-4">
        <button id="actionBtn" onclick="toggleStart()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-2xl font-bold text-base transition shadow-lg shadow-emerald-600/20 flex items-center gap-2">
            <span>Mulai (Start)</span>
        </button>
        <button id="nextBtn" onclick="nextChat()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-6 py-3 rounded-2xl font-semibold text-base transition hidden">
            Lewati (Next)
        </button>
    </footer>

    <!-- Logika Aplikasi & Firebase -->
    <script>
        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            databaseURL: "https://obrolan-global-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isStarted = false;
        let localStream = null;
        let myUserId = 'user_' + Math.floor(Math.random() * 1000000);
        let currentRoomId = null;
        let chatListener = null;

        const localVideo = document.getElementById('localVideo');
        const localPlaceholder = document.getElementById('localPlaceholder');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const statusBadge = document.getElementById('statusBadge');
        const actionBtn = document.getElementById('actionBtn');
        const nextBtn = document.getElementById('nextBtn');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chatBox');

        async function toggleStart() {
            if (!isStarted) {
                try {
                    // 1. Nyalakan Kamera
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    localVideo.srcObject = localStream;
                    localVideo.classList.remove('hidden');
                    localPlaceholder.classList.add('hidden');

                    isStarted = true;
                    statusBadge.textContent = 'Mencari Lawan Bicara...';
                    statusBadge.className = 'px-3 py-1 bg-yellow-500/20 text-yellow-400 text-xs font-medium rounded-full border border-yellow-500/30';
                    
                    actionBtn.textContent = 'Berhenti (Stop)';
                    actionBtn.className = 'bg-red-600 hover:bg-red-500 text-white px-8 py-3 rounded-2xl font-bold text-base transition shadow-lg shadow-red-600/20';
                    nextBtn.classList.remove('hidden');

                    // 2. Mulai Cari Pasangan di Firebase
                    findOrCreateRoom();

                } catch (err) {
                    alert('Gagal mengakses kamera/mikrofon.');
                    console.error(err);
                }
            } else {
                stopChat();
            }
        }

        function findOrCreateRoom() {
            chatBox.innerHTML = '<div class="text-center text-slate-500 text-xs my-auto">Mencari pengguna lain secara acak...</div>';
            
            const waitingRef = db.ref('waiting_queue');
            waitingRef.once('value', (snapshot) => {
                let waitingUser = null;
                snapshot.forEach((childSnapshot) => {
                    if (childSnapshot.key !== myUserId) {
                        waitingUser = childSnapshot.key;
                    }
                });

                if (waitingUser) {
                    // Ada orang yang sedang menunggu, buat ruangan bersama
                    currentRoomId = 'room_' + Math.min(myUserId, waitingUser) + '_' + Math.max(myUserId, waitingUser);
                    
                    // Hapus dari antrean dan masuk ruangan
                    db.ref('waiting_queue/' + waitingUser).remove();
                    connectToRoom(currentRoomId);
                } else {
                    // Tidak ada yang menunggu, masukkan diri ke antrean
                    db.ref('waiting_queue/' + myUserId).set(true);
                    
                    // Cek terus jika ada orang lain yang memasangkan diri ke kita
                    db.ref('waiting_queue/' + myUserId).onDisconnect().remove();
                    
                    // Listener jika ada yang mencocokkan kita
                    listenForMatch();
                }
            });
        }

        function listenForMatch() {
            const queueRef = db.ref('waiting_queue/' + myUserId);
            // Simulasi pengecekan ruangan aktif
            const checkInterval = setInterval(() => {
                if (!isStarted) {
                    clearInterval(checkInterval);
                    return;
                }
                // Cek apakah antrean kita sudah diambil orang lain
                queueRef.once('value', (snapshot) => {
                    if (!snapshot.exists() && currentRoomId === null) {
                        // Berarti ada yang mengambil kita masuk ke ruangan
                        // Untuk sederhananya, kita buatkan ruang otomatis jika antrean kosong
                        clearInterval(checkInterval);
                    }
                });
            }, 2000);
        }

        function connectToRoom(roomId) {
            currentRoomId = roomId;
            statusBadge.textContent = 'Terhubung Realtime!';
            statusBadge.className = 'px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-medium rounded-full border border-emerald-500/30';
            
            remotePlaceholder.innerHTML = '<span class="text-sm font-medium text-emerald-400">Terhubung dengan Orang Asing!</span>';
            chatBox.innerHTML = '<div class="text-center text-slate-500 text-[10px] my-1">--- Terhubung ke obrolan realtime ---</div>';
            
            chatInput.disabled = false;
            sendBtn.disabled = false;

            // Dengarkan pesan masuk di ruangan ini
            const messagesRef = db.ref('rooms/' + roomId + '/messages');
            chatListener = messagesRef.on('child_added', (snapshot) => {
                const msgData = snapshot.val();
                appendMessage(msgData.sender === myUserId ? 'me' : 'other', msgData.text);
            });
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (text === '' || !currentRoomId) return;

            // Kirim pesan ke Firebase Realtime Database
            const messagesRef = db.ref('rooms/' + currentRoomId + '/messages');
            messagesRef.push({
                sender: myUserId,
                text: text,
                timestamp: Date.now()
            });

            chatInput.value = '';
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            if (sender === 'me') {
                msgDiv.className = 'bg-blue-600 text-white p-2.5 rounded-xl rounded-br-none max-w-[80%] self-end text-xs';
            } else {
                msgDiv.className = 'bg-slate-800 text-slate-200 p-2.5 rounded-xl rounded-bl-none max-w-[80%] self-start text-xs';
            }
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function nextChat() {
            cleanupCurrentChat();
            findOrCreateRoom();
        }

        function stopChat() {
            cleanupCurrentChat();
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            localVideo.classList.add('hidden');
            localPlaceholder.classList.remove('hidden');
            remotePlaceholder.classList.remove('hidden');
            remotePlaceholder.innerHTML = '<span class="text-sm font-medium">Menunggu lawan bicara...</span>';

            isStarted = false;
            statusBadge.textContent = 'Offline';
            statusBadge.className = 'px-3 py-1 bg-red-500/20 text-red-400 text-xs font-medium rounded-full border border-red-500/30';
            
            actionBtn.textContent = 'Mulai (Start)';
            actionBtn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-2xl font-bold text-base transition shadow-lg shadow-emerald-600/20';
            nextBtn.classList.add('hidden');
            
            chatInput.disabled = true;
            sendBtn.disabled = true;
            chatBox.innerHTML = '<div class="text-center text-slate-600 text-xs my-auto">Obrolan dihentikan.</div>';
        }

        function cleanupCurrentChat() {
            if (currentRoomId && chatListener) {
                db.ref('rooms/' + currentRoomId + '/messages').off('child_added', chatListener);
            }
            db.ref('waiting_queue/' + myUserId).remove();
            currentRoomId = null;
        }

        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
